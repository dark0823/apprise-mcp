<svg width="840" height="380" viewBox="0 0 840 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <!-- Notification Glow -->
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Canvas Outer Background -->
  <rect width="840" height="380" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <rect x="0" y="0" width="840" height="42" rx="16" fill="#151D2F" />
  <rect x="0" y="24" width="840" height="18" fill="#151D2F" />
  <line x1="0" y1="42" x2="840" y2="42" stroke="#1E293B" stroke-width="1" />

  <!-- Mac Window Dots -->
  <circle cx="24" cy="21" r="6" fill="#EF4444" />
  <circle cx="44" cy="21" r="6" fill="#F59E0B" />
  <circle cx="64" cy="21" r="6" fill="#10B981" />

  <!-- Window Title -->
  <text x="420" y="26" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">
    Claude Desktop / Cursor — Apprise-MCP Live Dispatch
  </text>

  <!-- Left: AI Agent Chat Bubble -->
  <g transform="translate(32, 64)">
    <!-- User Prompt Bubble -->
    <rect x="0" y="0" width="460" height="68" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="16" y="25" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">YOU (PROMPT)</text>
    <text x="16" y="48" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
      "Run the end-to-end audit, and ping my phone when done."
    </text>

    <!-- Agent Response & Tool Trigger -->
    <g transform="translate(0, 84)">
      <rect x="0" y="0" width="460" height="168" rx="12" fill="#151D2F" stroke="#2563EB" stroke-width="1.2" />
      
      <!-- Agent Header -->
      <circle cx="24" cy="24" r="10" fill="#3B82F6" />
      <text x="24" y="28" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AI</text>
      <text x="44" y="28" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Claude Agent</text>
      <text x="135" y="28" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">completed task in 12s</text>

      <!-- Tool Call Block -->
      <g transform="translate(16, 46)">
        <rect x="0" y="0" width="428" height="58" rx="8" fill="#0B132B" stroke="#1D4ED8" stroke-width="1" />
        <text x="12" y="22" fill="#60A5FA" font-family="'Fira Code', monospace" font-size="11" font-weight="600">🔨 TOOL CALL: send_notification()</text>
        <text x="12" y="42" fill="#94A3B8" font-family="'Fira Code', monospace" font-size="11">target: ["tgram://bot:token/chat_id", "discord://..."]</text>
      </g>

      <!-- Dispatch Status -->
      <g transform="translate(16, 118)">
        <circle cx="8" cy="18" r="5" fill="#10B981" />
        <text x="22" y="22" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
          ✓ Dispatched to Telegram &amp; Discord simultaneously!
        </text>
      </g>
    </g>
  </g>

  <!-- Right: Floating Mobile Push Notification Card -->
  <g transform="translate(516, 100)" filter="url(#shadow)">
    <!-- Device Glass Card -->
    <rect x="0" y="0" width="292" height="186" rx="16" fill="url(#cardGlow)" stroke="#38BDF8" stroke-width="1.5" />

    <!-- Telegram App Icon -->
    <rect x="18" y="18" width="36" height="36" rx="9" fill="#229ED9" />
    <path d="M26 35 L29 45 L32 38 L42 27 L20 33 Z" fill="#FFFFFF" />
    <path d="M29 45 L33 41 L29 38 Z" fill="#D2EBF7" />

    <!-- Card Header -->
    <text x="64" y="32" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Telegram</text>
    <text x="64" y="48" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">APPRISE-MCP BOT • NOW</text>

    <!-- Notification Content -->
    <text x="18" y="86" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">
      🎉 Task Complete!
    </text>

    <text x="18" y="112" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
      End-to-end security audit finished.
    </text>
    <text x="18" y="130" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      All 42 services verified • 0 vulnerabilities.
    </text>

    <!-- Swipe Indicator -->
    <rect x="116" y="168" width="60" height="4" rx="2" fill="#475569" />
  </g>

  <!-- Footer Tagline -->
  <text x="420" y="354" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">
    Works instantly with Claude Desktop, Cursor, DeepSeek, Cowork, and any MCP Client.
  </text>
</svg>
